name: Build and Release gtarot

on:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.17' # Or your preferred Go version

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Build for Linux
      run: GOOS=linux GOARCH=amd64 go build -o build/linux/gtarot

    - name: Build for Windows
      run: GOOS=windows GOARCH=amd64 go build -o build/windows/gtarot.exe

    - name: Build for MacOS (amd64)
      run: GOOS=darwin GOARCH=amd64 go build -o build/macos/gtarot_amd64

    - name: Build for MacOS (arm64)
      run: GOOS=darwin GOARCH=arm64 go build -o build/macos/gtarot_arm64

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: gtarot-builds
        path: build/

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: gtarot-builds
        path: build/

    - name: Create Release Tag
      id: create_tag
      run: |
        TAG_NAME="v$(date +'%Y%m%d%H%M%S')"
        echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
        git tag "$TAG_NAME"
        git push origin "$TAG_NAME"

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v1 # Using v1 as v2 requires GITHUB_TOKEN in env
      with:
        tag_name: ${{ env.TAG_NAME }}
        files: |
          build/linux/gtarot
          build/windows/gtarot.exe
          build/macos/gtarot_amd64
          build/macos/gtarot_arm64
        body: |
          ## gtarot Release

          ### Binaries:
          - `gtarot` (Linux)
          - `gtarot.exe` (Windows)
          - `gtarot_amd64` (macOS amd64)
          - `gtarot_arm64` (macOS arm64)
